<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Chat Example</title>
        <script type="text/javascript">
            window.onload = function () {
                var log = document.getElementById("log");

                function appendLog(item) {
                    var doScroll =
                        log.scrollTop > log.scrollHeight - log.clientHeight - 1;
                    log.appendChild(item);
                    if (doScroll) {
                        log.scrollTop = log.scrollHeight - log.clientHeight;
                    }
                }

                document.getElementById("form-user-1").onsubmit = function () {
                    // init connection to websocket
                    if (window["WebSocket"]) {
                        let conn = new WebSocket(
                            "ws://" +
                                document.location.host +
                                "/ws/matchmaking/1/1"
                        );

                        conn.onclose = function (evt) {
                            var item = document.createElement("div");
                            item.innerHTML = "<b>Connection closed.</b>";
                            appendLog(item);
                        };

                        conn.onmessage = function (evt) {
                            data = JSON.parse(evt.data);
                            if (data.status == 0) {
                                var item = document.createElement("div");
                                // create message add queue position from data.queue_position
                                item.innerHTML = "<b>Waiting for match...</b>"
                                appendLog(item);
                            } else if (data.status == 1) {
                                var item = document.createElement("div");
                                item.innerHTML = "<b>Match found!</b>";
                                appendLog(item);

                                let newConn = new WebSocket(
                                    "ws://" +
                                        document.location.host +
                                        "/ws/dualquiz/" +
                                        data.room_id + "/1"
                                );

                                newConn.onclose = function (evt) {
                                    var item = document.createElement("div");
                                    item.innerHTML = "<b>Connection closed.</b>";
                                    appendLog(item);
                                };

                                newConn.onmessage = function (evt) {
                                    data = JSON.parse(evt.data);
                                    console.log(data)
                                    if (data.status == 2) {
                                        // Game has finished
                                        var item = document.createElement("div");
                                        item.innerHTML = "<b>Game has finished...</b>";
                                        appendLog(item);
                                    }
                                    if (data.status == 0) {
                                        var item = document.createElement("div");
                                        item.innerHTML = "<b>Game has started for player 1...</b>";
                                        appendLog(item);

                                        setTimeout(() => {
                                            const message = {
                                                type: "Answer",
                                                choice: 0,
                                            };
                                            newConn.send(JSON.stringify(message));
                                            var item = document.createElement("div");
                                            item.innerHTML = "<b>Answer is sent for player 1...</b>";
                                            appendLog(item);

                                        }, 3000);
                                    }
                                };
                            }
                        };
                    } else {
                        var item = document.createElement("div");
                        item.innerHTML =
                            "<b>Your browser does not support WebSockets.</b>";
                        appendLog(item);
                    }

                    return false;
                };


                document.getElementById("form-user-2").onsubmit = function () {
                    // init connection to websocket
                    if (window["WebSocket"]) {
                        let conn2 = new WebSocket(
                            "ws://" +
                            document.location.host +
                            "/ws/matchmaking/1/2"
                        );

                        conn2.onclose = function (evt) {
                            var item = document.createElement("div");
                            item.innerHTML = "<b>Connection closed.</b>";
                            appendLog(item);
                        };

                        conn2.onmessage = function (evt) {
                            data = JSON.parse(evt.data);
                            console.log(data)
                            if (data.status == 0) {
                                var item = document.createElement("div");
                                // create message add queue position from data.queue_position
                                item.innerHTML = "<b>Waiting for match...</b>"
                                appendLog(item);
                            } else if (data.status == 1) {
                                var item = document.createElement("div");
                                item.innerHTML = "<b>Match found!</b>";
                                appendLog(item);

                                // add delay here to fake loading times
                                    let newConn2 = new WebSocket(
                                        "ws://" +
                                        document.location.host +
                                        "/ws/dualquiz/" +
                                        data.room_id + "/2"
                                    );

                                    newConn2.onclose = function (evt) {
                                        var item = document.createElement("div");
                                        item.innerHTML = "<b>Connection closed.</b>";
                                        appendLog(item);
                                    };

                                    newConn2.onmessage = function (evt) {
                                        data = JSON.parse(evt.data);
                                        console.log(data)
                                        if (data.status == 2) {
                                            // Game has finished
                                            var item = document.createElement("div");
                                            item.innerHTML = "<b>Game has finished...</b>";
                                            appendLog(item);
                                        }

                                        if (data.status == 0) {
                                            var item = document.createElement("div");
                                            item.innerHTML = "<b>Game has started for player 2</b>";
                                            appendLog(item);

                                            setTimeout(() => {
                                                const message = {
                                                    type: "Answer",
                                                    choice: 3,
                                                };
                                                newConn2.send(JSON.stringify(message));
                                                var item = document.createElement("div");
                                                item.innerHTML = "<b>Answer is sent for player 2...</b>";
                                                appendLog(item);

                                            }, 2000);
                                        }
                                    };
                            }
                        };
                    } else {
                        var item = document.createElement("div");
                        item.innerHTML =
                            "<b>Your browser does not support WebSockets.</b>";
                        appendLog(item);
                    }

                    return false;
                };
            };
        </script>
        <style type="text/css">
            html {
                overflow: hidden;
            }

            body {
                overflow: hidden;
                padding: 0;
                margin: 0;
                width: 100%;
                height: 100%;
                background: gray;
            }

            #log {
                background: white;
                margin: 0;
                padding: 0.5em 0.5em 0.5em 0.5em;
                position: absolute;
                top: 0.5em;
                left: 0.5em;
                right: 0.5em;
                bottom: 3em;
                overflow: auto;
            }

            #btn-enter {
                background-color: #4CAF50;
                color: white;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                cursor: pointer;
                width: 100%;
            }
            #btn-enter-2 {
                background-color: #4CAF50;
                color: white;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                cursor: pointer;
                width: 100%;
            }
            #forms {
                margin: 0;
                position: absolute;
                bottom: 1em;
                left: 0px;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
            }

            .form {
                width: 50%;
                padding: 10px;
                min-height: 10vh;
            }
        </style>
    </head>
    <body>
        <div id="log"></div>
        <div id="forms">
            <form id="form-user-1" class="form">
                <input type="submit" value="Matchmaking for User 1" id="btn-enter" />
            </form>
            <form id="form-user-2" class="form">
                <input type="submit" value="Matchmaking for User 2" id="btn-enter-2" />
            </form>
        </div>

    </body>
</html>
